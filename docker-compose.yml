# Local development services only. Never use these credentials outside your machine.
services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_local_only
      POSTGRES_DB: orbit_dev
    ports:
      - "5433:5432"
    volumes:
      - orbit_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orbit_pgdata:
