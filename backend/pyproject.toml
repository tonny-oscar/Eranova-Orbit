[project]
name = "eranova-orbit-api"
version = "0.1.0"
description = "Eranova Orbit backend API"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Dev tooling that runs the bundled PostgreSQL binaries with fixed arguments.
"scripts/**" = ["S603", "S607", "S608"]
# Adapters hold public token-endpoint URLs and help text, never secret values.
"app/integrations/*.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]
